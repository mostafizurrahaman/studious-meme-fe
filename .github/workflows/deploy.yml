name: Deploy Malamal Frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-malamal-frontend
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ১. রানারের ভার্চুয়াল মেশিনে কোড নিয়ে আসা
      - name: Checkout code
        uses: actions/checkout@v4

      # ২. রানারে Node.js সেটআপ করা
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ৩. রানারে pnpm সেটআপ করা
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # ৪. রানারে ডিপেন্ডেন্সি ইন্সটল করা (টেস্ট করার জন্য প্রয়োজন)
      - name: Install dependencies on runner
        run: pnpm install

      # ৫. রানারে টেস্ট স্ক্রিপ্ট চালানো
      # আপনার package.json-এ 'test' স্ক্রিপ্ট থাকতে হবে
      - name: Run Tests
        run: pnpm test

      # ৬. টেস্ট পাস হলে তবেই কেবল SSH-এর মাধ্যমে VPS-এ ডিপ্লয়মেন্ট শুরু হবে
      - name: Deploy over SSH
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -euo pipefail

            APP_DIR="/var/www/MalaMal_Frontend"
            APP_NAME="malamal-frontend"

            echo "==> Preparing app directory"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"

            cd "$APP_DIR"

            echo "==> Updating source code"

            if [ ! -d ".git" ]; then
              git clone -b main "${{ secrets.REPO_URL }}" .
            else
              git remote set-url origin "${{ secrets.REPO_URL }}"
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            fi

            echo "==> Removing old Next.js build"

            rm -rf .next
            rm -rf node_modules

            echo "==> Creating environment file"

            cat > .env <<'EOF'
            ${{ secrets.ENV_FILE }}
            EOF

            echo "==> Installing dependencies"

            pnpm install --frozen-lockfile

            echo "==> Building Next.js"

            pnpm build

            echo "==> Restarting application"

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start pnpm \
                --name "$APP_NAME" \
                -- start
            fi

            pm2 save

            echo "==> Deployment successful"

            pm2 status
